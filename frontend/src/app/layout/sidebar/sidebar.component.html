<aside class="sidebar" [class.collapsed]="collapsed()">
  <!-- Logo -->
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">
        <span nz-icon nzType="file-text" nzTheme="outline" class="text-2xl text-white"></span>
      </div>
      @if (!collapsed()) {
        <div class="logo-text">
          <span class="title">Askara</span>
          <span class="subtitle">Document System</span>
        </div>
      }
    </div>
  </div>

  <!-- Menu -->
  <nav class="sidebar-nav">
    <ul nz-menu nzMode="inline" [nzInlineCollapsed]="collapsed()" nzTheme="dark">
      @for (item of visibleMenuItems(); track item.key) {
        @if (hasChildren(item)) {
          <li nz-submenu [nzTitle]="item.label" [nzIcon]="item.icon || ''">
            <ul>
              @for (child of item.children; track child.key) {
                <li nz-menu-item nzMatchRouter>
                  <a [routerLink]="child.route" [queryParams]="child.queryParams || {}">{{ child.label }}</a>
                </li>
              }
            </ul>
          </li>
        } @else {
          <li nz-menu-item nzMatchRouter>
            <a [routerLink]="item.route">
              @if (item.icon) {
                <span nz-icon [nzType]="item.icon" nzTheme="outline"></span>
              }
              <span>{{ item.label }}</span>
            </a>
          </li>
        }
      }
    </ul>
  </nav>

  <!-- Collapse Toggle -->
  <div class="sidebar-footer">
    <button class="collapse-btn" (click)="toggleCollapse.emit()">
      <span nz-icon [nzType]="collapsed() ? 'menu-unfold' : 'menu-fold'" nzTheme="outline"></span>
      @if (!collapsed()) {
        <span class="collapse-text">Tutup Menu</span>
      }
    </button>
  </div>
</aside>
