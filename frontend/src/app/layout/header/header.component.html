<header class="header" [class.collapsed]="sidebarCollapsed()">
  <div class="header-left">
    <!-- Mobile menu toggle -->
    <button class="p-2 rounded-lg text-gray-500 hover:bg-gray-100 lg:hidden" (click)="toggleMobileSidebar.emit()">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <!-- Search -->
    <div class="search-box hidden md:flex">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" class="search-input" placeholder="Cari dokumen...">
    </div>
  </div>

  <div class="header-right">
    <!-- Notifications -->
    <div class="relative">
      <button class="p-2 rounded-lg text-gray-500 hover:bg-gray-100" (click)="toggleNotificationMenu()">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="notification-badge">3</span>
      </button>

      @if (notificationMenuOpen()) {
        <div class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-lg border border-gray-200 z-50">
          <div class="px-4 py-3 border-b border-gray-100">
            <div class="flex items-center justify-between">
              <span class="font-medium text-gray-900">Notifikasi</span>
              <button class="text-sm text-blue-600 hover:text-blue-700">Tandai dibaca</button>
            </div>
          </div>
          <div class="max-h-64 overflow-y-auto">
            <a href="#" class="flex items-start gap-3 px-4 py-3 hover:bg-gray-50 border-l-2 border-blue-500 bg-blue-50">
              <div class="w-8 h-8 rounded-lg bg-blue-100 flex items-center justify-center flex-shrink-0">
                <svg class="w-4 h-4 text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm text-gray-900">Dokumen <strong>SOP-001</strong> menunggu review</p>
                <span class="text-xs text-gray-500">5 menit lalu</span>
              </div>
            </a>
            <a href="#" class="flex items-start gap-3 px-4 py-3 hover:bg-gray-50">
              <div class="w-8 h-8 rounded-lg bg-green-100 flex items-center justify-center flex-shrink-0">
                <svg class="w-4 h-4 text-green-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm text-gray-700">Dokumen <strong>PKS-003</strong> telah disetujui</p>
                <span class="text-xs text-gray-500">1 jam lalu</span>
              </div>
            </a>
          </div>
          <div class="px-4 py-2 border-t border-gray-100 text-center">
            <a href="#" class="text-sm text-blue-600 hover:text-blue-700">Lihat semua</a>
          </div>
        </div>
      }
    </div>

    <!-- User Menu -->
    <div class="relative">
      <button class="user-trigger" (click)="toggleUserMenu()">
        <div class="avatar">{{ userName().charAt(0) }}</div>
        <div class="user-info hidden md:block">
          <span class="user-name">{{ userName() }}</span>
        </div>
        <svg class="w-4 h-4 text-gray-400 hidden md:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      @if (userMenuOpen()) {
        <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50">
          <a [routerLink]="['/profile']" class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50" (click)="closeDropdowns()">
            <svg class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Profil Saya
          </a>
          <a [routerLink]="['/profile/change-password']" class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50" (click)="closeDropdowns()">
            <svg class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Ubah Password
          </a>
          <div class="my-1 border-t border-gray-100"></div>
          <button class="flex items-center gap-2 px-4 py-2 text-sm text-red-600 hover:bg-red-50 w-full" (click)="logout()">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Logout
          </button>
        </div>
      }
    </div>
  </div>
</header>
