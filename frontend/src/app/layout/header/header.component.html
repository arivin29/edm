<header class="header" [class.collapsed]="sidebarCollapsed()">
  <div class="header-left">
    <!-- Mobile menu toggle -->
    <button class="mobile-toggle lg:hidden" (click)="toggleMobileSidebar.emit()">
      <span nz-icon nzType="menu-unfold" nzTheme="outline"></span>
    </button>

    <!-- Search -->
    <nz-input-group [nzPrefix]="prefixIcon" class="search-box hidden md:block">
      <input type="text" nz-input placeholder="Cari dokumen..." />
    </nz-input-group>
    <ng-template #prefixIcon>
      <span nz-icon nzType="search" nzTheme="outline"></span>
    </ng-template>
  </div>

  <div class="header-right">
    <!-- Notifications -->
    <nz-badge [nzCount]="3" nzSize="small">
      <a nz-dropdown [nzDropdownMenu]="notifMenu" nzTrigger="click" class="header-icon">
        <span nz-icon nzType="bell" nzTheme="outline"></span>
      </a>
    </nz-badge>
    <nz-dropdown-menu #notifMenu="nzDropdownMenu">
      <div class="notification-dropdown">
        <div class="notif-header">
          <span>Notifikasi</span>
          <a href="#">Tandai dibaca</a>
        </div>
        <div class="notif-list">
          <div class="notif-item unread">
            <span nz-icon nzType="file-text" nzTheme="outline" class="text-blue-500"></span>
            <div class="notif-content">
              <p>Dokumen <strong>SOP-001</strong> menunggu review</p>
              <span class="time">5 menit lalu</span>
            </div>
          </div>
          <div class="notif-item">
            <span nz-icon nzType="check" nzTheme="outline" class="text-green-500"></span>
            <div class="notif-content">
              <p>Dokumen <strong>PKS-003</strong> telah disetujui</p>
              <span class="time">1 jam lalu</span>
            </div>
          </div>
        </div>
        <div class="notif-footer">
          <a href="#">Lihat semua</a>
        </div>
      </div>
    </nz-dropdown-menu>

    <!-- User Menu -->
    <a nz-dropdown [nzDropdownMenu]="userMenu" nzTrigger="click" class="user-trigger">
      <nz-avatar [nzText]="userInitial" nzSize="small" class="bg-blue-500"></nz-avatar>
      <span class="user-name hidden md:inline">{{ userName() }}</span>
      <span nz-icon nzType="down" nzTheme="outline" class="text-xs"></span>
    </a>
    <nz-dropdown-menu #userMenu="nzDropdownMenu">
      <ul nz-menu>
        <li nz-menu-item>
          <a routerLink="/profile">
            <span nz-icon nzType="user" nzTheme="outline"></span>
            Profil Saya
          </a>
        </li>
        <li nz-menu-item>
          <a routerLink="/profile/change-password">
            <span nz-icon nzType="safety" nzTheme="outline"></span>
            Ubah Password
          </a>
        </li>
        <li nz-menu-divider></li>
        <li nz-menu-item nzDanger (click)="logout()">
          <span nz-icon nzType="logout" nzTheme="outline"></span>
          Logout
        </li>
      </ul>
    </nz-dropdown-menu>
  </div>
</header>
