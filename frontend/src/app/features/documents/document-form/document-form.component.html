<form [formGroup]="form" (ngSubmit)="onSubmit()" class="document-form">
  @if (errorMessage()) {
    <div class="form-error-banner">
      {{ errorMessage() }}
    </div>
  }

  <app-form-field label="Judul Dokumen" [error]="getFieldError('title')" [required]="true">
    <app-input formControlName="title" placeholder="Masukkan judul dokumen" />
  </app-form-field>

  <div class="form-row">
    <app-form-field label="Tipe Dokumen" [error]="getFieldError('document_type_id')" [required]="true">
      <app-select
        formControlName="document_type_id"
        [options]="documentTypes()"
        placeholder="Pilih tipe dokumen"
      />
    </app-form-field>

    <app-form-field label="Kategori" [error]="getFieldError('category_id')" [required]="true">
      <app-select
        formControlName="category_id"
        [options]="categories()"
        placeholder="Pilih kategori"
      />
    </app-form-field>
  </div>

  <app-form-field label="Template" hint="Pilih template untuk memulai dengan format standar">
    <app-select
      formControlName="template_id"
      [options]="templates()"
      placeholder="Pilih template (opsional)"
    />
  </app-form-field>

  <app-form-field label="Deskripsi">
    <app-textarea
      formControlName="description"
      placeholder="Deskripsi singkat dokumen"
      [rows]="3"
      [maxlength]="500"
      [showCount]="true"
    />
  </app-form-field>

  <div class="form-row">
    <app-form-field label="Tanggal Efektif">
      <app-input formControlName="effective_date" type="date" />
    </app-form-field>

    <app-form-field label="Tanggal Kedaluwarsa">
      <app-input formControlName="expiry_date" type="date" />
    </app-form-field>
  </div>

  @if (mode === 'create') {
    <app-form-field label="Upload File" hint="Format: .docx, .pdf. Maksimal 50MB">
      <app-file-upload
        accept=".docx,.pdf"
        [maxSize]="52428800"
        (fileSelected)="onFileSelected($event)"
        (fileRemoved)="onFileRemoved()"
        (error)="onFileError($event)"
      />
    </app-form-field>
  }

  <div class="form-actions">
    <button type="button" class="btn btn-outline" (click)="onCancel()" [disabled]="isSubmitting()">
      Batal
    </button>
    <button type="submit" class="btn btn-primary" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        <span class="spinner"></span>
      }
      {{ mode === 'create' ? 'Buat Dokumen' : 'Simpan Perubahan' }}
    </button>
  </div>
</form>
